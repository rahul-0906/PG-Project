version: '3.8'

services:
  pgcore-db:
    image: postgres:18-alpine
    container_name: pgcore-db
    environment:
      POSTGRES_DB: pgcrmdb
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pgcrm123}
    ports:
      - "5432:5432"
    volumes:
      - pgcore_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pgcrmdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pgcrm-network

  pgcore-backend:
    build:
      context: ./core-pg-crm/backend
      dockerfile: Dockerfile
    container_name: pgcore-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgcore-db:5432/pgcrmdb
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-pgcrm123}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      PG_NAME: ${PG_NAME:-PG CRM}
      PG_PRIMARY_COLOR: ${PG_PRIMARY_COLOR:-#2563eb}
    ports:
      - "8080:8080"
    depends_on:
      pgcore-db:
        condition: service_healthy
    networks:
      - pgcrm-network

  pgcore-frontend:
    build:
      context: ./core-pg-crm/frontend
      dockerfile: Dockerfile
    container_name: pgcore-frontend
    ports:
      - "5173:80"
    depends_on:
      - pgcore-backend
    networks:
      - pgcrm-network

volumes:
  pgcore_db_data:

networks:
  pgcrm-network:
    name: pgcrm-network
    driver: bridge
