server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/controlplane_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    # PERF-04: show-sql disabled — SQL logging in production adds per-query overhead.
    show-sql: false
    hibernate:
      # PERF-05: Changed from 'update' to 'validate'. Hibernate 'update' can silently
      # corrupt production schemas. Flyway (enabled below) manages all DDL changes.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

razorpay:
  key:
    # SEC-10: Defaults cleared — must be set via RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET env vars.
    # Real-looking test credentials as YAML defaults are a leak risk in committed code.
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}
  # SEC-01: Sandbox bypass flag. Set to true ONLY for local integration testing.
  # MUST be false (the default) in production and staging.
  bypass-signature-for-sandbox: ${RAZORPAY_BYPASS_SIGNATURE:false}

onboarding:
  setup-fee-inr: 15000
