# ─────────────────────────────────────────────────────────────────────────────
# Production Profile — active when SPRING_PROFILES_ACTIVE=prod
# Overrides the dev settings from application.yml with production PostgreSQL.
# All sensitive values are read from environment variables.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pgcrmdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:pgcrm}
    password: ${DB_PASSWORD:pgcrm123}
    continue-on-error: false
    hikari:
      pool-name: PgCrmProdHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:25}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      connection-timeout: ${HIKARI_CONN_TIMEOUT:20000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}
      validation-timeout: 5000

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate   # Validate the schema; do not make schema changes in production
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: true  # CRITICAL: Never allow flyway.clean() in production — it drops all data

# ─── Production Logging ───────────────────────────────────────────────────────
logging:
  level:
    com.pgcrm: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

app:
  seed-demo: false

