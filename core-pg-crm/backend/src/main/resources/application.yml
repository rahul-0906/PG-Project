spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: pg-crm
  config:
    import:
      - "classpath:tenant-config.yml"
      - "optional:file:./tenant-config.yml"
      - "optional:file:../tenant-config.yml"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ─── PostgreSQL (Active & Exclusive) ────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pgcrmdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    continue-on-error: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

pg:
  system:
    branding:
      name: ${PG_NAME:PG CRM}
      short-title: ${PG_SHORT_NAME:PG}
      primary-color: ${PG_PRIMARY_COLOR:#2563eb}


  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

  # ─── Email / Gmail SMTP ─────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-gmail@gmail.com}
    password: ${MAIL_PASSWORD:your-gmail-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  thymeleaf:
    cache: false
    mode: HTML

# ─── JWT & Seed Config ─────────────────────────────────────────
app:
  seed-demo: ${SEED_DEMO:false}
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForPGCRMAppThatShouldBeAtLeast256BitsForHS256}
    access-token-expiration: 900000       # 15 min
    refresh-token-expiration: 604800000   # 7 days
  mail:
    from: ${MAIL_FROM:noreply@pgcrm.com}
    from-name: ${pg.system.branding.name:PG CRM}
    enabled: ${MAIL_ENABLED:true}        # set true after configuring Gmail App Password
  cors:
    # SEC-02: Explicit CORS origins for SecurityConfig. Set APP_CORS_ALLOWED_ORIGINS in production.
    # Example: APP_CORS_ALLOWED_ORIGINS=https://app.yourpg.com,https://admin.yourpg.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ─── Razorpay ────────────────────────────────────────────────────
razorpay:
  # SEC-10: Defaults cleared — must be set via RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET env vars.
  # Real-looking test credentials as YAML defaults are a leak risk in committed code.
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  enabled: ${RAZORPAY_ENABLED:true}     # enabled with real keys

# ─── Meta WhatsApp Cloud API ─────────────────────────────────────
meta:
  whatsapp:
    phone-number-id: ${META_WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${META_WHATSAPP_ACCESS_TOKEN:}
    verify-token: ${META_WEBHOOK_VERIFY_TOKEN:}

# ─── Server ──────────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ─── Logging ─────────────────────────────────────────────────────
logging:
  level:
    com.pgcrm: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
